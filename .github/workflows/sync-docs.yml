name: Sync Docs (Reusable)

on:
    workflow_call:
        inputs:
            repo-name:
                description: "URL path segment for this project (defaults to the calling repo's name)"
                required: false
                type: string
                default: ""

jobs:
    sync:
        name: Sync docs and rebuild site
        runs-on: [self-hosted, docs]
        permissions:
            contents: read
            deployments: write
        environment:
            name: docs-${{ inputs.repo-name || github.event.repository.name }}
            url: https://docs.trickfirerobotics.com/${{ inputs.repo-name || github.event.repository.name }}

        steps:
            - name: Checkout calling repo
              uses: actions/checkout@v7

            - name: Resolve repo name
              id: name
              run: |
                  NAME="${{ inputs.repo-name }}"
                  if [ -z "$NAME" ]; then
                    NAME="${{ github.event.repository.name }}"
                  fi
                  echo "value=$NAME" >> "$GITHUB_OUTPUT"

            - name: Sync docs content
              run: |
                  DEST="/home/trickfire/docs/content/${{ steps.name.outputs.value }}"
                  mkdir -p "$DEST"
                  rsync -av --delete --checksum docs/ "$DEST/"
                  cp docs.config.json "$DEST/docs.config.json"

            - name: Rebuild and deploy docs site
              run: bash /home/trickfire/docs/scripts/build.sh
